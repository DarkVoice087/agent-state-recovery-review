name: Recovery protocol review
description: Report a concrete correctness concern using synthetic examples only.
body:
  - type: textarea
    id: invariant
    attributes:
      label: Invariant or missing failure window
      description: What can go wrong, and which part of the protocol is affected?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include OS/Python versions, expected behavior and observed behavior. No real state or secrets.
    validations:
      required: true
